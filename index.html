    <script>
      // Suppress benign Vite HMR WebSocket connection errors and unhandled rejections in iframe/sandbox environment
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.indexOf('websocket') !== -1 || s.indexOf('[vite]') !== -1 || s.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.description || String(reason))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          var target = event && event.target;
          var isWebSocketTarget = target && (target.tagName === undefined && (String(target.url || '').indexOf('ws') !== -1 || String(target.src || '').indexOf('ws') !== -1));
          if (isWsError(msg) || isWebSocketTarget) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (isWsError(text)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
