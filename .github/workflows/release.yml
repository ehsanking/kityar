name: Build and Publish Desktop App

on:
  push:
    tags:
      - 'v*' # e.g. v1.0.0 → builds and publishes a GitHub Release
  workflow_dispatch: # manual run → builds installers as a downloadable artifact only

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build web app
        run: npm run build

      # No Apple Developer certificate: skip keychain lookup; the app is ad-hoc signed.
      - name: Disable code-sign identity discovery
        if: runner.os == 'macOS'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      # Build only; publishing happens once in the `release` job below so parallel
      # OS builds cannot race each other into duplicate draft releases.
      - name: Package
        run: npx electron-builder --config electron-builder.json --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kityar-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create release with all installers
        uses: softprops/action-gh-release@v2
        with:
          name: KitYar ${{ github.ref_name }}
          files: installers/*
          generate_release_notes: true
